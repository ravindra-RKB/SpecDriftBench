[project]
name = "specdrift"
version = "0.1.0"
description = "Evaluating Coding-Agent Reliability Under Changing Requirements"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "streamlit>=1.28.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "mypy"
]
llm = [
    "openai>=1.0.0"
]

[project.scripts]
specdrift = "specdrift.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
